apiVersion: v1
kind: Namespace
metadata:
  name: search

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-api-sa
  namespace: search
  labels:
    app: search-api
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
spec:
  type: ClusterIP
  selector:
    app: search-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "search-api"
    spec:
      serviceAccountName: search-api-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-api
          image: myregistry/search:1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
---
{
  "manifest_yaml": "# ⚠️ GÉNÉRATION LIBRE — non vérifiée par les contrôles habituels du pipeline, à valider manuellement avant tout déploiement.\napiVersion: elasticsearch.k8s.elastic.co/v1\nkind: Elasticsearch\nmetadata:\n  name: elasticsearch\n  annotations:\n    vault.hashicorp.com/agent-inject: \"true\"\n    vault.hashicorp.com/role: \"elasticsearch-role\"\nspec:\n  version: 8.11.0\n  nodeSets:\n  - name: default\n    count: 3\n    config:\n      node.store.allow_mmap: false\n    podTemplate:\n      metadata:\n        annotations:\n          vault.hashicorp.com/agent-inject: \"true\"\n          vault.hashicorp.com/role: \"elasticsearch-role\"",
  "fields_addressed": [
    "non_standard_requirements: Cluster Elasticsearch ECK avec 3 nœuds de données",
    "global_constraints: Injection Vault Agent Injector pour la gestion des credentials"
  ],
  "fields_left_open": [
    "service_component_standard_fields: Aucun composant récursif standard fourni dans l'entrée"
  ],
  "security_requirements_addressed": [
    "Authentification et gestion des credentials gérées via HashiCorp Vault avec injection automatique dans les pods (Vault Agent Injector)"
  ],
  "security_requirements_left_open": [],
  "observability_requirements_addressed": [],
  "observability_requirements_left_open": [
    "Observabilité et métriques Prometheus pour le cluster Elasticsearch"
  ],
  "ingress_addressed": [],
  "ingress_left_open": [
    "Exposition externe du cluster Elasticsearch non configurée"
  ],
  "rbac_addressed": [],
  "rbac_left_open": [
    "RBAC spécifique à l'accès au cluster Elasticsearch"
  ],
  "warnings": [
    "Ressource générée via la CRD Elasticsearch de l'opérateur ECK (elasticsearch.k8s.elastic.co/v1) à titre de génération libre non vérifiée par les contrôles standards.",
    "L'annotation Vault Agent Injector utilise le rôle supposé 'elasticsearch-role' ; veuillez adapter selon votre configuration HashiCorp Vault."
  ]
}