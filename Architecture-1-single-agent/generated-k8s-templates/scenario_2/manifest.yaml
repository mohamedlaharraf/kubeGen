apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: analytics-db
  namespace: data
spec:
  # 3 instances pour haute disponibilité et résilience
  instances:
    - name: instance1
    - name: instance2
    - name: instance3
  # Réplication synchrone pour conformité PCI-DSS (zéro perte de données)
  replication:
    synchronous: true
  backups:
    # Chiffrement au repos obligatoire pour PCI-DSS
    pgbackrest:
      repos:
        - name: repo1
          volume:
            volumeClaimSpec:
              accessModes: [ "ReadWriteOnce" ]
              resources:
                requests:
                  storage: 10Gi
              # Hypothèse : StorageClass 'encrypted-gold' gère le chiffrement matériel/logiciel au repos
              storageClassName: encrypted-gold 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: data
  labels:
    app: analytics-api
    version: "2.0"
    part-of: analytics-platform
spec:
  # minReplicas=2 pour assurer la disponibilité sans sur-consommation énergétique
  replicas: 2
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
        version: "2.0"
      annotations:
        # Activation du sidecar Dapr pour pub/sub
        dapr.io/enabled: "true"
        dapr.io/app-id: "analytics-api"
        dapr.io/app-port: "8080"
    spec:
      securityContext:
        # Conformité PCI-DSS : exécution non-root
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: analytics-api
          image: myregistry/analytics:2.0
          ports:
            - containerPort: 8080
          securityContext:
            # PCI-DSS : Système de fichiers immuable pour réduire la surface d'attaque
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: DB_HOST
              value: "analytics-db-instances"
            - name: DB_PORT
              value: "5432"
            # Les secrets PCI-DSS (clés, mots de passe) doivent être injectés via un Secret Kubernetes ou Vault
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: analytics-db-secrets
                  key: password
          resources:
            # Dimensionnement optimisé pour limiter le gaspillage énergétique (requests < limits)
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: data
spec:
  selector:
    app: analytics-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: analytics-api-hpa
  namespace: data
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: analytics-api
  # Efficacité énergétique : minReplicas bas, scale-up uniquement si nécessaire
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
# Note sur la rotation des clés (PCI-DSS) : 
# La rotation tous les 90 jours ne peut être définie dans un manifeste statique.
# Elle doit être implémentée via un CronJob Kubernetes appelant l'API du KMS 
# ou via un outil comme HashiCorp Vault avec des secrets dynamiques.