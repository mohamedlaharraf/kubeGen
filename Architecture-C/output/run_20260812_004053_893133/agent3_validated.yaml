apiVersion: v1
kind: Namespace
metadata:
  name: ops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kernel-debugger-sa
  namespace: ops
  labels:
    app: kernel-debugger
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kernel-debugger
  namespace: ops
  labels:
    app: kernel-debugger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kernel-debugger
  template:
    metadata:
      labels:
        app: kernel-debugger
    spec:
      serviceAccountName: kernel-debugger-sa
      containers:
        - name: kernel-debugger
          image: myregistry/kdebug:latest
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            runAsUser: 0