<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760" role="img" aria-labelledby="title desc">
  <title id="title">Architecture D : débat multi-agents pour l'optimisation énergétique</title>
  <desc id="desc">L'architecture C est conservée, mais l'agent énergie devient un sous-système de débat : trois stratégies en parallèle, critiques croisées et juge final.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#40526b"/></marker>
    <style>
      .title{font:700 27px 'DejaVu Sans',Arial,sans-serif;fill:#182235}.subtitle{font:16px 'DejaVu Sans',Arial,sans-serif;fill:#536277}.label{font:700 16px 'DejaVu Sans',Arial,sans-serif;fill:#182235}.small{font:13px 'DejaVu Sans',Arial,sans-serif;fill:#34435a}.edge{stroke:#40526b;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke:#6d7e94;stroke-width:1.8;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.feedback{stroke:#40526b;stroke-width:2.3;fill:none;stroke-linejoin:round;stroke-linecap:round}.branch{stroke:#40526b;stroke-width:2.3;fill:none;stroke-linejoin:round}.box{stroke-width:2;rx:13}.tag{font:700 13px 'DejaVu Sans',Arial,sans-serif;fill:#6b4c00}
    </style>
  </defs>
  <rect width="1700" height="760" fill="#ffffff"/>
  <text x="65" y="58" class="title">Architecture D — Débat multi-agents pour l’optimisation énergétique</text>
  <text x="65" y="87" class="subtitle">L’architecture C est conservée ; seul le traitement énergie devient un débat borné avec arbitrage explicite.</text>
  <rect x="40" y="331" width="122" height="82" class="box" fill="#f8e9ff" stroke="#d66cdd"/><text x="101" y="365" text-anchor="middle" class="label">Utilisateur</text><text x="101" y="389" text-anchor="middle" class="small">Demande</text>
  <rect x="210" y="316" width="150" height="112" class="box" fill="#ddfaf6" stroke="#48c9bd"/><text x="285" y="350" text-anchor="middle" class="label">1. Analyse</text><text x="285" y="375" text-anchor="middle" class="small">Spécification et</text><text x="285" y="399" text-anchor="middle" class="small">contraintes globales</text>
  <rect x="405" y="316" width="150" height="112" class="box" fill="#fff1df" stroke="#f6a24a"/><text x="480" y="350" text-anchor="middle" class="label">2. Génération</text><text x="480" y="375" text-anchor="middle" class="small">YAML initial</text><text x="480" y="399" text-anchor="middle" class="small">par composant</text>
  <rect x="600" y="316" width="150" height="112" class="box" fill="#e7f3ff" stroke="#60a9e8"/><text x="675" y="350" text-anchor="middle" class="label">3. Validation</text><text x="675" y="375" text-anchor="middle" class="small">Schéma, cohérence</text><text x="675" y="399" text-anchor="middle" class="small">et sécurité</text>
  <path d="M162 372 H210" fill="none" stroke="#40526b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M360 372 H405" fill="none" stroke="#40526b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M555 372 H600" fill="none" stroke="#40526b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M675 428 V492 H480 V443" fill="none" stroke="#40526b" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><text x="490" y="455" class="small">retour</text><text x="578" y="477" text-anchor="middle" class="tag">Cycle 1 — correction bornée (maximum 3)</text>
  <rect x="785" y="150" width="450" height="365" class="box" fill="#eefaf4" stroke="#60bf83" stroke-dasharray="7 5"/>
  <text x="1010" y="184" text-anchor="middle" class="label">4. Sous-système de débat énergétique</text><text x="1010" y="207" text-anchor="middle" class="small">Même entrée pour les stratégies ; rôles et justifications distincts</text>
  <rect x="815" y="238" width="158" height="54" class="box" fill="#fff5ce" stroke="#e4bd3d"/><text x="894" y="270" text-anchor="middle" class="label">Consolidation</text>
  <rect x="815" y="313" width="158" height="54" class="box" fill="#fff5ce" stroke="#e4bd3d"/><text x="894" y="345" text-anchor="middle" class="label">Dimensionnement</text>
  <rect x="815" y="388" width="158" height="54" class="box" fill="#fff5ce" stroke="#e4bd3d"/><text x="894" y="420" text-anchor="middle" class="label">Mise à l’échelle</text>
  <text x="778" y="330" text-anchor="end" class="small">fan-out parallèle</text>
  <path d="M750 372 H785 V265 H815 M785 372 V340 H815 M785 372 V415 H815" fill="none" stroke="#40526b" stroke-width="2.3" stroke-linejoin="round"/>
  <rect x="1015" y="285" width="188" height="78" class="box" fill="#e7f3ff" stroke="#60a9e8"/><text x="1109" y="318" text-anchor="middle" class="label">Critiques croisées</text><text x="1109" y="342" text-anchor="middle" class="small">1 à 2 tours maximum</text>
  <path d="M973 265 H1015 M973 340 H1015 M973 415 H995 V363 H1015" fill="none" stroke="#40526b" stroke-width="2.3" stroke-linejoin="round"/>
  <rect x="1030" y="404" width="158" height="63" class="box" fill="#eeeaff" stroke="#9d83e8"/><text x="1109" y="435" text-anchor="middle" class="label">Juge</text><text x="1109" y="458" text-anchor="middle" class="small">Fusion et arbitrage justifié</text>
  <path d="M1109 363 V404" fill="none" stroke="#40526b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="1210" y="418" text-anchor="end" class="small">YAML optimisé et verdict</text>
  <rect x="1284" y="316" width="160" height="112" class="box" fill="#eeeaff" stroke="#9d83e8"/><text x="1364" y="350" text-anchor="middle" class="label">5. Vérification</text><text x="1364" y="375" text-anchor="middle" class="small">Audit global et</text><text x="1364" y="399" text-anchor="middle" class="small">gaps réparables</text>
  <rect x="1490" y="331" width="160" height="82" class="box" fill="#f1f6fb" stroke="#77889f"/><text x="1570" y="365" text-anchor="middle" class="label">Sortie</text><text x="1570" y="389" text-anchor="middle" class="small">YAML + audit</text>
  <path d="M1188 436 H1235 V372 H1284" fill="none" stroke="#40526b" stroke-width="2.3" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <path d="M1444 372 H1490" fill="none" stroke="#40526b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <rect x="1284" y="552" width="160" height="68" class="box" fill="#fff1f1" stroke="#ef8f8f"/><text x="1364" y="581" text-anchor="middle" class="label">Réparation</text><text x="1364" y="605" text-anchor="middle" class="small">Patch ciblé</text>
  <path d="M1364 428 V552" fill="none" stroke="#40526b" stroke-width="2.3"/><text x="1374" y="534" class="small">réparer</text><path d="M1444 586 H1470 V470 H1364 V443" fill="none" stroke="#40526b" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><text x="1374" y="458" class="small">recontrôler</text><text x="1364" y="653" text-anchor="middle" class="tag">Cycle 2 — réparation bornée (maximum 2)</text>
  <text x="850" y="710" text-anchor="middle" class="subtitle">Le débat ne modifie pas le graphe externe : il remplace uniquement l’étape d’optimisation énergétique de C.</text>
</svg>
