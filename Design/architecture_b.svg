<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="590" viewBox="0 0 1600 590" role="img" aria-labelledby="title desc">
  <title id="title">Architecture B : pipeline séquentiel à cinq agents</title>
  <desc id="desc">Cinq agents spécialisés s'exécutent de façon séquentielle, sans arête de retour entre agents.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#40526b"/></marker>
    <style>
      .title{font:700 27px 'DejaVu Sans',Arial,sans-serif;fill:#182235}.subtitle{font:16px 'DejaVu Sans',Arial,sans-serif;fill:#536277}.label{font:700 16px 'DejaVu Sans',Arial,sans-serif;fill:#182235}.small{font:13px 'DejaVu Sans',Arial,sans-serif;fill:#34435a}.edge{stroke:#40526b;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.box{stroke-width:2;rx:13}.tag{font:700 13px 'DejaVu Sans',Arial,sans-serif;fill:#6b4c00}
    </style>
  </defs>
  <rect width="1600" height="590" fill="#ffffff"/>
  <text x="65" y="58" class="title">Architecture B — Pipeline séquentiel à cinq agents spécialisés</text>
  <text x="65" y="87" class="subtitle">Le graphe est strictement orienté vers l’aval : chaque agent reçoit la sortie structurée de l’étape précédente.</text>
  <rect x="48" y="239" width="125" height="84" class="box" fill="#f8e9ff" stroke="#d66cdd"/>
  <text x="110" y="273" text-anchor="middle" class="label">Utilisateur</text><text x="110" y="297" text-anchor="middle" class="small">Demande</text>
  <rect x="225" y="193" width="190" height="175" class="box" fill="#ddfaf6" stroke="#48c9bd"/>
  <text x="320" y="229" text-anchor="middle" class="label">1. Analyse</text><text x="320" y="255" text-anchor="middle" class="small">Normalisation de la demande</text><text x="320" y="279" text-anchor="middle" class="small">Extraction des contraintes</text>
  <rect x="246" y="304" width="148" height="43" rx="9" fill="#fff5ce" stroke="#f1c84d"/><text x="320" y="331" text-anchor="middle" class="tag">Auto-vérification interne bornée</text>
  <rect x="474" y="224" width="174" height="114" class="box" fill="#fff1df" stroke="#f6a24a"/>
  <text x="561" y="259" text-anchor="middle" class="label">2. Génération</text><text x="561" y="284" text-anchor="middle" class="small">YAML initial par composant</text><text x="561" y="308" text-anchor="middle" class="small">Gabarit et sécurité</text>
  <rect x="706" y="224" width="174" height="114" class="box" fill="#e7f3ff" stroke="#60a9e8"/>
  <text x="793" y="259" text-anchor="middle" class="label">3. Validation</text><text x="793" y="284" text-anchor="middle" class="small">Syntaxe et cohérence</text><text x="793" y="308" text-anchor="middle" class="small">du manifeste</text>
  <rect x="938" y="224" width="174" height="114" class="box" fill="#e8f7ed" stroke="#60bf83"/>
  <text x="1025" y="255" text-anchor="middle" class="label">4. Optimisation</text><text x="1025" y="280" text-anchor="middle" class="small">Ressources, HPA/KEDA,</text><text x="1025" y="304" text-anchor="middle" class="small">placement</text>
  <rect x="1170" y="224" width="174" height="114" class="box" fill="#eeeaff" stroke="#9d83e8"/>
  <text x="1257" y="255" text-anchor="middle" class="label">5. Vérification</text><text x="1257" y="280" text-anchor="middle" class="small">Audit final et</text><text x="1257" y="304" text-anchor="middle" class="small">traçabilité</text>
  <rect x="1402" y="239" width="145" height="84" class="box" fill="#f1f6fb" stroke="#77889f"/>
  <text x="1474" y="273" text-anchor="middle" class="label">Sortie</text><text x="1474" y="297" text-anchor="middle" class="small">YAML + audit</text>
  <path d="M173 281 H225" fill="none" stroke="#40526b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M415 281 H474" fill="none" stroke="#40526b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M648 281 H706" fill="none" stroke="#40526b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M880 281 H938" fill="none" stroke="#40526b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M1112 281 H1170" fill="none" stroke="#40526b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <path d="M1344 281 H1402" fill="none" stroke="#40526b" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="444" y="203" text-anchor="middle" class="small">spécification normalisée</text><text x="677" y="203" text-anchor="middle" class="small">YAML initial</text><text x="909" y="203" text-anchor="middle" class="small">YAML validé</text><text x="1141" y="203" text-anchor="middle" class="small">YAML optimisé</text>
  <rect x="269" y="445" width="1060" height="67" rx="14" fill="#f8fafc" stroke="#b7c5d7" stroke-dasharray="7 6"/>
  <text x="799" y="474" text-anchor="middle" class="label">Principe d’isolement du contexte</text><text x="799" y="499" text-anchor="middle" class="small">Aucun agent n’accède au texte brut après l’analyse ; il ne reçoit que les champs utiles à son rôle.</text>
</svg>
