apiVersion: v1
kind: Namespace
metadata:
  name: media

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-resizer-sa
  namespace: media
  labels:
    app: image-resizer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: media
  labels:
    app: image-resizer
spec:
  replicas: 0
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
    spec:
      serviceAccountName: image-resizer-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-resizer
          image: myregistry/resizer:3.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: rabbitmq-config
                  key: host

---
{
  "manifest_yaml": "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: image-resizer-sa\n---\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: image-resizer\n  labels:\n    app: image-resizer\nspec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: image-resizer\n  template:\n    metadata:\n      labels:\n        app: image-resizer\n    spec:\n      serviceAccountName: image-resizer-sa\n      securityContext:\n        runAsNonRoot: true\n        seccompProfile:\n          type: RuntimeDefault\n      containers:\n        - name: image-resizer\n          image: image-resizer:latest\n          securityContext:\n            allowPrivilegeEscalation: false\n            readOnlyRootFilesystem: true\n            capabilities:\n              drop:\n                - ALL\n---\n# ⚠️ GÉNÉRATION LIBRE — non vérifiée par les contrôles habituels du pipeline, à valider manuellement avant tout déploiement.\napiVersion: keda.sh/v1alpha1\nkind: ScaledObject\nmetadata:\n  name: image-resizer-keda\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: image-resizer\n  minReplicaCount: 0\n  maxReplicaCount: 10\n  triggers:\n    - type: rabbitmq\n      metadata:\n        queueName: resize-queue\n        mode: QueueLength\n        value: \"5\"",
  "fields_addressed": [
    "component_name: image-resizer",
