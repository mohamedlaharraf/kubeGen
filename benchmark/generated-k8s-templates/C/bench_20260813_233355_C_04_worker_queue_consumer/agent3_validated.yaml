apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: media
data:
  host: rabbitmq.media.svc.cluster.local
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-resizer-sa
  namespace: media
  labels:
    app: image-resizer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: media
  labels:
    app: image-resizer
spec:
  replicas: 0
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
    spec:
      serviceAccountName: image-resizer-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-resizer
          image: myregistry/resizer:3.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: rabbitmq-config
                  key: host