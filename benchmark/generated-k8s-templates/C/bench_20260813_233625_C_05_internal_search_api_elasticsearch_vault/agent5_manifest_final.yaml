apiVersion: v1
kind: Namespace
metadata:
  name: search
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-api-sa
  namespace: search
  labels:
    app: search-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "search-api"
    spec:
      serviceAccountName: search-api-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: search-api
        image: myregistry/search:1.0
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
spec:
  type: ClusterIP
  selector:
    app: search-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch-cluster
  namespace: search
  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/managed-by: eck
spec:
  version: 8.11.0
  nodeSets:
  - name: default
    count: 3
    config:
      node.store.allow_mmap: false
    podTemplate:
      metadata:
        annotations:
          vault.hashicorp.com/agent-inject: "true"
          vault.hashicorp.com/role: "elasticsearch-role"
      spec:
        serviceAccountName: elasticsearch-sa
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch-sa
  namespace: search
  labels:
    app.kubernetes.io/name: elasticsearch