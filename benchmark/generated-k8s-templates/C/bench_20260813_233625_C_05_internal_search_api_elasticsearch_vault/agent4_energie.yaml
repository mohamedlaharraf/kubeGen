apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-api-sa
  namespace: search
  labels:
    app: search-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/role: search-api
    spec:
      serviceAccountName: search-api-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: search-api
        image: myregistry/search:1.0
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
spec:
  type: ClusterIP
  selector:
    app: search-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: Namespace
metadata:
  name: search
---
manifest_yaml: "# \u26A0\uFE0F G\xC9N\xC9RATION LIBRE \u2014 non v\xE9rifi\xE9e par\
  \ les contr\xF4les habituels du pipeline, \xE0 valider manuellement avant tout d\xE9\
  ploiement.\napiVersion: elasticsearch.k8s.elastic.co/v1\nkind: Elasticsearch\nmetadata:\n\
  \  name: elasticsearch-cluster\n  labels:\n    app.kubernetes.io/name: elasticsearch\n\
  \    app.kubernetes.io/managed-by: eck\nspec:\n  version: 8.11.0\n  nodeSets:\n\
  \  - name: default\n    count: 3\n    config:\n      node.store.allow_mmap: false\n\
  \    podTemplate:\n      metadata:\n        annotations:\n          vault.hashicorp.com/agent-inject:\
  \ \"true\"\n          vault.hashicorp.com/role: \"elasticsearch-role\"\n      spec:\n\
  \        serviceAccountName: elasticsearch-sa\n--- \napiVersion: v1\nkind: ServiceAccount\n\
  metadata:\n  name: elasticsearch-sa\n  labels:\n    app.kubernetes.io/name: elasticsearch"
fields_addressed:
