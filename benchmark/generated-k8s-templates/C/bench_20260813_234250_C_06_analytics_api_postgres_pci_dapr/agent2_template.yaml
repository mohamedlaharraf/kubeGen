apiVersion: v1
kind: Namespace
metadata:
  name: data

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-api-sa
  namespace: data
  labels:
    app: analytics-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: data
  labels:
    app: analytics-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
      annotations:
        dapr.io/app-id: analytics-api
        dapr.io/enabled: "true"
    spec:
      serviceAccountName: analytics-api-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-api
          image: myregistry/analytics:2.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: data
  labels:
    app: analytics-api
spec:
  type: ClusterIP
  selector:
    app: analytics-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP

---
{
  "manifest_yaml": "# ⚠️ GÉNÉRATION LIBRE — non vérifiée par les contrôles habituels du pipeline, à valider manuellement avant tout déploiement.\napiVersion: postgres-operator.crunchydata.com/v1beta1\nkind: PostgresCluster\nmetadata:\n  name: postgres-cluster\n  labels:\n    app.kubernetes.io/name: postgres-cluster\n    app.kubernetes.io/part-of: pci-dss-compliant-app\nspec:\n  postgresVersion: 15\n  instances:\n    - name: instance1\n      replicas: 3\n      dataVolumeClaimSpec:\n        accessModes:\n          - ReadWriteOnce\n        resources:\n          requests:\n            storage: 20Gi\n  synchronousReplication: true\n  backups:\n    pgbackrest:\n      repos:\n        - name: repo1\n          volume:\n            volumeClaimSpec:\n              accessModes:\n                - ReadWriteOnce\n              resources:\n                requests:\n                  storage: 20Gi\n---\napiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: postgres-cluster-sa\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: postgres-cluster-netpol\nspec:\n  podSelector:\n    matchLabels:\n      postgres-operator.crunchydata.com/cluster: postgres-cluster\n  policyTypes:\n    - Ingress\n    - Egress\n  ingress:\n    - from:\n        - podSelector:\n            matchLabels:\n              pci-dss-tier: backend\n  egress:\n    - to:\n        - namespaceSelector:\n            matchLabels:\n              kubernetes.io/metadata.name: kube-system\n      ports:\n        - protocol: UDP\n          port: 53\n        - protocol: TCP\n          port: 53",
