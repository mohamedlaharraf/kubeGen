apiVersion: v1
kind: Namespace
metadata:
  name: search
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-api-sa
  namespace: search
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: search
spec:
  type: ClusterIP
  selector:
    app: search-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-api-netpol
  namespace: search
spec:
  podSelector:
    matchLabels:
      app: search-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
    spec:
      serviceAccountName: search-api-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-api
          image: myregistry/search:1.0
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: vault-agent
          image: hashicorp/vault-agent:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
{
  "manifest_yaml": "# ⚠️ GÉNÉRATION LIBRE — non vérifiée par les contrôles habituels du pipeline, à valider manuellement avant tout déploiement.\napiVersion: elasticsearch.k8s.elastic.co/v1\nkind: Elasticsearch\nmetadata:\n  name: elasticsearch\nspec:\n  version: 8.12.0\n  nodeSets:\n  - name: default\n    count: 3\n    config:\n      node.store.allow_mmap: true\n    podTemplate:\n      metadata:\n        annotations:\n          vault.hashicorp.com/agent-inject: \"true\"\n          vault.hashicorp.com/role: \"elasticsearch\"\n          vault.hashicorp.com/agent-inject-secret-config: \"secret/data/elasticsearch/config\"\n      spec:\n        securityContext:\n          fsGroup: 1000",
  "fields_addressed": [
    "non_standard_requirements: Cluster Elasticsearch ECK 3 nœuds",
    "global_constraints: HashiCorp Vault Agent Injector"
  ],
  "fields_left_open": [],
  "security_requirements_addressed": [
    "Injection automatique des credentials via Vault Agent Injector (annotations podTemplate)"
  ],
  "security_requirements_left_open": [],
  "observability_requirements_addressed": [],
  "observability_requirements_left_open": [],
  "ingress_addressed": [],
  "ingress_left_open": [],
  "rbac_addressed": [],
  "rbac_left_open": [],
  "warnings": [
    "L'opérateur ECK (Elastic Cloud on Kubernetes) doit être installé dans le cluster pour que la ressource 'Elasticsearch' soit traitée.",
    "L'injecteur Vault Agent doit être installé et configuré pour que les annotations 'vault.hashicorp.com' soient effectives.",
    "La version d'Elasticsearch '8.12.0' a été supposée par défaut.",
    "Le rôle Vault 'elasticsearch' et le secret 'secret/data/elasticsearch/config' sont supposés exister côté Vault."
  ]
}