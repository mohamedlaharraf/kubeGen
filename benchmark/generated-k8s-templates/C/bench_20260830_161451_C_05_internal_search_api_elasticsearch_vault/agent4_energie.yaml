apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-api-sa
  namespace: search
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: search
spec:
  type: ClusterIP
  selector:
    app: search-api
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-api-netpol
  namespace: search
spec:
  podSelector:
    matchLabels:
      app: search-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
    spec:
      serviceAccountName: search-api-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: search-api
        image: myregistry/search:1.0
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      - name: vault-agent
        image: hashicorp/vault-agent:latest
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "100m"
            memory: "128Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Namespace
metadata:
  name: search
---
manifest_yaml: "# \u26A0\uFE0F G\xC9N\xC9RATION LIBRE \u2014 non v\xE9rifi\xE9e par\
  \ les contr\xF4les habituels du pipeline, \xE0 valider manuellement avant tout d\xE9\
  ploiement.\napiVersion: elasticsearch.k8s.elastic.co/v1\nkind: Elasticsearch\nmetadata:\n\
  \  name: elasticsearch\nspec:\n  version: 8.12.0\n  nodeSets:\n  - name: default\n\
  \    count: 3\n    config:\n      node.store.allow_mmap: true\n    podTemplate:\n\
  \      metadata:\n        annotations:\n          vault.hashicorp.com/agent-inject:\
  \ \"true\"\n          vault.hashicorp.com/role: \"elasticsearch\"\n          vault.hashicorp.com/agent-inject-secret-config:\
  \ \"secret/data/elasticsearch/config\"\n      spec:\n        securityContext:\n\
  \          fsGroup: 1000"
fields_addressed:
- "non_standard_requirements: Cluster Elasticsearch ECK 3 n\u0153uds"
- 'global_constraints: HashiCorp Vault Agent Injector'
fields_left_open: []
security_requirements_addressed:
- Injection automatique des credentials via Vault Agent Injector (annotations podTemplate)
security_requirements_left_open: []
observability_requirements_addressed: []
observability_requirements_left_open: []
ingress_addressed: []
ingress_left_open: []
rbac_addressed: []
rbac_left_open: []
warnings:
- "L'op\xE9rateur ECK (Elastic Cloud on Kubernetes) doit \xEAtre install\xE9 dans\
  \ le cluster pour que la ressource 'Elasticsearch' soit trait\xE9e."
- "L'injecteur Vault Agent doit \xEAtre install\xE9 et configur\xE9 pour que les annotations\
  \ 'vault.hashicorp.com' soient effectives."
- "La version d'Elasticsearch '8.12.0' a \xE9t\xE9 suppos\xE9e par d\xE9faut."
- "Le r\xF4le Vault 'elasticsearch' et le secret 'secret/data/elasticsearch/config'\
  \ sont suppos\xE9s exister c\xF4t\xE9 Vault."
