apiVersion: v1
kind: Namespace
metadata:
  name: data

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-api-sa
  namespace: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: data
  labels:
    app: analytics-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "analytics-api"
    spec:
      serviceAccountName: analytics-api-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-api
          image: myregistry/analytics:2.0
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: data
spec:
  type: ClusterIP
  selector:
    app: analytics-api
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-api-netpol
  namespace: data
spec:
  podSelector:
    matchLabels:
      app: analytics-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
{
  "manifest_yaml": "apiVersion: v1\nkind: ServiceAccount\nmetadata:\n  name: postgres-db-sa\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: postgres-db-netpol\nspec:\n  podSelector:\n    matchLabels:\n      app: postgres-db\n  policyTypes:\n  - Ingress\n  - Egress\n  ingress:\n  - from:\n    - podSelector: {}\n  egress:\n  - to:\n    - namespaceSelector:\n        matchLabels:\n          kubernetes.io/metadata.name: kube-system\n    ports:\n    - protocol: UDP\n      port: 53\n    - protocol: TCP\n      port: 53\n---\n# ⚠️ GÉNÉRATION LIBRE — non vérifiée par les contrôles habituels du pipeline, à valider manuellement avant tout déploiement.\napiVersion: postgres-operator.crunchydata.com/v1beta1\nkind: PostgresCluster\nmetadata:\n  name: postgres-db\nspec:\n  instances:\n    - name: instance1\n    - name: instance2\n    - name: instance3\n  replication:\n    synchronous: true\n  storage:\n    storageClassName: encrypted-storage",
  "fields_addressed": [
    "non_standard_requirements: CrunchyData PostgreSQL",
    "global_constraints: PCI-DSS compliance",
    "global_constraints: Volume encryption"
  ],
  "fields_left_open": [
    "component_name: déduit de l'exigence (postgres-db)",
    "image: gérée par l'opérateur CrunchyData",
    "ports: gérés par l'opérateur CrunchyData",
    "replicas: définis via instances dans PostgresCluster"
  ],
  "security_requirements_addressed": [
    "PCI-DSS: Isolation réseau via NetworkPolicy (Ingress restreint, Egress DNS uniquement)",
    "Volume encryption: Utilisation d'une StorageClass 'encrypted-storage'"
  ],
  "security_requirements_left_open": [
    "Rotation des clés tous les 90 jours: nécessite un gestionnaire de secrets externe (Vault/AWS KMS) et un processus d'automatisation non implémentable via YAML statique"
  ],
  "observability_requirements_addressed": [],
  "observability_requirements_left_open": [],
  "ingress_addressed": [],
  "ingress_left_open": [],
  "rbac_addressed": [
    "ServiceAccount: postgres-db-sa créé"
  ],
  "rbac_left_open": [],
  "warnings": [
    "La ressource PostgresCluster nécessite l'installation de l'opérateur CrunchyData PostgreSQL dans le cluster.",
    "Le chiffrement au repos dépend de la configuration réelle de la StorageClass 'encrypted-storage' sur le fournisseur cloud.",
    "La rotation des clés est une exigence de conformité qui doit être orchestrée par un outil de gestion de secrets et non par le manifeste Kubernetes."
  ]
}