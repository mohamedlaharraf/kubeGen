apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: checkout-api-multicluster
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - cluster: cluster-test-unique
        url: REMPLACER-PAR-URL-API-DU-CLUSTER-cluster-test-unique
  template:
    metadata:
      name: '{{cluster}}-checkout-api'
    spec:
      destination:
        namespace: payments
        server: '{{url}}'
      project: default
      source:
        path: REMPLACER-PAR-LE-CHEMIN-DU-MANIFESTE
        repoURL: https://REMPLACER-PAR-VOTRE-DEPOT-GIT.git
        targetRevision: HEAD
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: checkout-api
  name: checkout-api-sa
  namespace: payments
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app: checkout-api
  name: checkout-api-role
  namespace: payments
rules:
- apiGroups:
  - ''
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app: checkout-api
  name: checkout-api-rolebinding
  namespace: payments
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: checkout-api-role
subjects:
- kind: ServiceAccount
  name: checkout-api-sa
  namespace: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: checkout-api
  name: checkout-api
  namespace: payments
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '9091'
        prometheus.io/scrape: 'true'
      labels:
        app: checkout-api
    spec:
      containers:
      - env:
        - name: NODE_ENV
          value: production
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: checkout-db-secret
        image: myregistry/checkout:2.0
        name: checkout-api
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9091
          name: metrics
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      - image: envoyproxy/envoy:v1.28.0
        name: envoy-sidecar
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: checkout-api-sa
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: checkout-api
  name: checkout-api
  namespace: payments
spec:
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080
  - name: metrics
    port: 9091
    protocol: TCP
    targetPort: 9091
  selector:
    app: checkout-api
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: checkout-api
  name: checkout-api
  namespace: payments
spec:
  rules:
  - host: checkout.exemple.com
    http:
      paths:
      - backend:
          service:
            name: checkout-api
            port:
              number: 8080
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - checkout.exemple.com
    secretName: checkout-tls-secret
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app: checkout-api
  name: checkout-api-netpol
  namespace: payments
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: payments
  podSelector:
    matchLabels:
      app: checkout-api
  policyTypes:
  - Ingress
---
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: order-worker
  name: worker-config
  namespace: payments
data:
  QUEUE_URL: amqp://rabbitmq.payments.svc.cluster.local:5672
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: order-worker
  name: order-worker-sa
  namespace: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: order-worker
  name: order-worker
  namespace: payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      containers:
      - env:
        - name: QUEUE_URL
          valueFrom:
            configMapKeyRef:
              key: QUEUE_URL
              name: worker-config
        image: myregistry/worker:1.5
        name: order-worker
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: order-worker-sa