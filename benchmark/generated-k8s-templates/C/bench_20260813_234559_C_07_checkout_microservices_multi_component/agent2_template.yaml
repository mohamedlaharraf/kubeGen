apiVersion: v1
kind: Namespace
metadata:
  name: payments

---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: checkout-api-multicluster
  namespace: argocd
spec:
  generators:
    - list:
        elements:
        - cluster: "cluster-test-unique"
          url: "REMPLACER-PAR-URL-API-DU-CLUSTER-cluster-test-unique"

  template:
    metadata:
      name: '{{cluster}}-checkout-api'
    spec:
      project: default
      source:
        repoURL: https://REMPLACER-PAR-VOTRE-DEPOT-GIT.git
        targetRevision: HEAD
        path: REMPLACER-PAR-LE-CHEMIN-DU-MANIFESTE
      destination:
        server: '{{url}}'
        namespace: payments
      syncPolicy:
        syncOptions:
          - CreateNamespace=true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout-api-sa
  namespace: payments
  labels:
    app: checkout-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: checkout-api-role
  namespace: payments
  labels:
    app: checkout-api
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: checkout-api-rolebinding
  namespace: payments
  labels:
    app: checkout-api
subjects:
- kind: ServiceAccount
  name: checkout-api-sa
  namespace: payments
roleRef:
  kind: Role
  name: checkout-api-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: payments
  labels:
    app: checkout-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: checkout-api-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: checkout-api
        image: myregistry/checkout:2.0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9091
          protocol: TCP
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: checkout-db-secret
              key: password
      - name: envoy-sidecar
        image: envoyproxy/envoy:v1.28.0
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: payments
  labels:
    app: checkout-api
spec:
  type: ClusterIP
  selector:
    app: checkout-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9091
    targetPort: 9091
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout-api
  namespace: payments
  labels:
    app: checkout-api
spec:
  rules:
  - host: checkout.exemple.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: checkout-api
            port:
              number: 8080
  tls:
  - hosts:
    - checkout.exemple.com
    secretName: checkout-tls-secret
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: checkout-api-netpol
  namespace: payments
  labels:
    app: checkout-api
spec:
  podSelector:
    matchLabels:
      app: checkout-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: payments

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-worker-sa
  namespace: payments
  labels:
    app: order-worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: payments
  labels:
    app: order-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-worker
  template:
    metadata:
      labels:
        app: order-worker
    spec:
      serviceAccountName: order-worker-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-worker
          image: myregistry/worker:1.5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: QUEUE_URL
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: QUEUE_URL
