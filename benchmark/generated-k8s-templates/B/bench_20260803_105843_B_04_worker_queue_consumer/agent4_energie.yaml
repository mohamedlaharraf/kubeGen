apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-resizer-sa
  namespace: media
  labels:
    app: image-resizer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: media
  labels:
    app: image-resizer
spec:
  replicas: 0
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
    spec:
      serviceAccountName: image-resizer-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: image-resizer
        image: myregistry/resizer:3.2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: rabbitmq-config
              key: host
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: image-resizer-scaledobject
  namespace: media
spec:
  scaleTargetRef:
    name: image-resizer
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
  - type: rabbitmq-queue
    metadata:
      queueName: resize-queue
      mode: QueueLength
      value: "5"
      hostFromEnv: RABBITMQ_HOST
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
---
manifest_yaml: "# \u26A0\uFE0F G\xC9N\xC9RATION LIBRE \u2014 non v\xE9rifi\xE9e par\
  \ les contr\xF4les habituels du pipeline, \xE0 valider manuellement avant tout d\xE9\
  ploiement.\napiVersion: keda.sh/v1alpha1\nkind: ScaledObject\nmetadata:\n  name:\
  \ rabbitmq-scaledobject\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n   \
  \ kind: Deployment\n    name: service-component\n  minReplicaCount: 0\n  maxReplicaCount:\
  \ 10\n  triggers:\n  - type: rabbitmq\n    metadata:\n      queueName: resize-queue\n\
  \      mode: QueueLength\n      value: \"5\""
fields_addressed:
- "exigence non-standard: Autoscaling bas\xE9 sur KEDA selon le nombre de messages\
  \ en attente dans la file RabbitMQ 'resize-queue' (min 0, max 10 r\xE9plicas)"
fields_left_open: []
security_requirements_addressed: []
security_requirements_left_open: []
observability_requirements_addressed: []
observability_requirements_left_open: []
ingress_addressed: []
ingress_left_open: []
rbac_addressed: []
rbac_left_open: []
warnings:
- "G\xE9n\xE9ration KEDA ScaledObject effectu\xE9e. N\xE9cessite l'op\xE9rateur KEDA\
  \ (keda.sh) install\xE9 dans le cluster et la configuration des secrets de connexion\
  \ RabbitMQ."
