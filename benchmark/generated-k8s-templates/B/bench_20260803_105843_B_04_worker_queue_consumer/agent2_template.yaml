apiVersion: v1
kind: Namespace
metadata:
  name: media

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-resizer-sa
  namespace: media
  labels:
    app: image-resizer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: media
  labels:
    app: image-resizer
spec:
  replicas: 0
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
    spec:
      serviceAccountName: image-resizer-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-resizer
          image: myregistry/resizer:3.2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: rabbitmq-config
                  key: host

---
{
  "manifest_yaml": "# ⚠️ GÉNÉRATION LIBRE — non vérifiée par les contrôles habituels du pipeline, à valider manuellement avant tout déploiement.\napiVersion: keda.sh/v1alpha1\nkind: ScaledObject\nmetadata:\n  name: rabbitmq-scaledobject\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: service-component\n  minReplicaCount: 0\n  maxReplicaCount: 10\n  triggers:\n  - type: rabbitmq\n    metadata:\n      queueName: resize-queue\n      mode: QueueLength\n      value: \"5\"",
  "fields_addressed": [
    "exigence non-standard: Autoscaling basé sur KEDA selon le nombre de messages en attente dans la file RabbitMQ 'resize-queue' (min 0, max 10 réplicas)"
  ],
  "fields_left_open": [],
  "security_requirements_addressed": [],
  "security_requirements_left_open": [],
  "observability_requirements_addressed": [],
  "observability_requirements_left_open": [],
  "ingress_addressed": [],
  "ingress_left_open": [],
  "rbac_addressed": [],
  "rbac_left_open": [],
  "warnings": [
    "Génération KEDA ScaledObject effectuée. Nécessite l'opérateur KEDA (keda.sh) installé dans le cluster et la configuration des secrets de connexion RabbitMQ."
  ]
}