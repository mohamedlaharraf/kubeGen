apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-resizer-sa
  namespace: media
  labels:
    app: image-resizer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: media
  labels:
    app: image-resizer
spec:
  replicas: 0
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
    spec:
      serviceAccountName: image-resizer-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: image-resizer
        image: myregistry/resizer:3.2
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: rabbitmq-config
              key: host
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: image-resizer-scaledobject
  namespace: media
spec:
  scaleTargetRef:
    name: image-resizer
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
  - type: rabbitmq-queue
    metadata:
      queueName: resize-queue
      mode: QueueLength
      value: "5"
      hostFromEnv: RABBITMQ_HOST