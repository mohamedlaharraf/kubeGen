apiVersion: v1
kind: Namespace
metadata:
  name: data

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-api-sa
  namespace: data
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: data
  labels:
    app: analytics-api
spec:
  type: ClusterIP
  selector:
    app: analytics-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: data
  labels:
    app: analytics-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "analytics-api"
        dapr.io/app-port: "8080"
    spec:
      serviceAccountName: analytics-api-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: analytics-api
          image: myregistry/analytics:2.0
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
{
  "manifest_yaml": "# ⚠️ GÉNÉRATION LIBRE — non vérifiée par les contrôles habituels du pipeline, à valider manuellement avant tout déploiement.\napiVersion: postgres-operator.crunchydata.com/v1beta1\nkind: PostgresCluster\nmetadata:\n  name: postgres-cluster\nspec:\n  instances: 3\n  replication:\n    synchronous: true\n  storage:\n    storageClassName: encrypted-storage",
  "fields_addressed": [
    "non-standard requirements: CrunchyData PostgreSQL"
  ],
  "fields_left_open": [],
  "security_requirements_addressed": [
    "chiffrement au repos obligatoire pour tous les volumes"
  ],
  "security_requirements_left_open": [],
  "observability_requirements_addressed": [],
  "observability_requirements_left_open": [],
  "ingress_addressed": [],
  "ingress_left_open": [],
  "rbac_addressed": [],
  "rbac_left_open": [],
  "warnings": [
    "L'utilisation de la ressource PostgresCluster nécessite l'installation de l'opérateur CrunchyData PostgreSQL dans le cluster.",
    "Le storageClassName 'encrypted-storage' a été utilisé comme placeholder pour répondre à l'exigence de chiffrement au repos ; ce nom doit être remplacé par le StorageClass chiffré réel du cluster."
  ]
}