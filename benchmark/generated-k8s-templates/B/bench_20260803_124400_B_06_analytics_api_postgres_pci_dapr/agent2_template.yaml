  "manifest_yaml": "# ℹ️ Exigence hors périmètre Kubernetes (aucune ressource K8s correspondante) : Procédure/Politique de rotation des clés de chiffrement tous les 90 jours pour conformité PCI-DSS niveau 1 — à tracer par un autre moyen (documentation, label, process d'équipe).",
