apiVersion: v1
kind: Namespace
metadata:
  name: ops

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: log-cleanup-sa
  namespace: ops
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-logs-volume
  namespace: ops
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: log-cleanup
  namespace: ops
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: log-cleanup-sa
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: log-cleanup
              image: myregistry/cleanup-tool:1.0
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: shared-logs-volume
                  mountPath: /logs
          volumes:
            - name: shared-logs-volume
              persistentVolumeClaim:
                claimName: shared-logs-volume
          restartPolicy: OnFailure