apiVersion: v1
kind: Namespace
metadata:
  name: search

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-api-sa
  namespace: search
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: search
spec:
  type: ClusterIP
  selector:
    app: search-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-api-netpol
  namespace: search
spec:
  podSelector:
    matchLabels:
      app: search-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
      annotations:
        vault.hashicorp.com/agent-inject: "true"
    spec:
      serviceAccountName: search-api-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-api
          image: myregistry/search:1.0
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
{
  "manifest_yaml": "# ⚠️ GÉNÉRATION LIBRE — non vérifiée par les contrôles habituels du pipeline, à valider manuellement avant tout déploiement.\napiVersion: elasticsearch.k8s.elastic.co/v1\nkind: Elasticsearch\nmetadata:\n  name: elasticsearch\nspec:\n  version: 8.12.0\n  nodeSets:\n  - name: data-nodes\n    count: 3\n    config:\n      node.roles: [\"master\", \"data\", \"ingest\"]",
  "fields_addressed": [
    "Cluster Elasticsearch géré par l'opérateur ECK (Elastic Cloud on Kubernetes) avec 3 nœuds de données"
  ],
  "fields_left_open": [],
  "security_requirements_addressed": [],
  "security_requirements_left_open": [],
  "observability_requirements_addressed": [],
  "observability_requirements_left_open": [],
  "ingress_addressed": [],
  "ingress_left_open": [],
  "rbac_addressed": [],
  "rbac_left_open": [],
  "warnings": [
    "L'opérateur ECK (Elastic Cloud on Kubernetes) doit être installé dans le cluster pour que cette ressource soit reconnue.",
    "La version '8.12.0' a été supposée par défaut, à adapter selon vos besoins.",
    "La configuration des rôles (master, data, ingest) est une configuration standard pour un petit cluster, à valider selon la charge prévue."
  ]
}