apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-resizer-sa
  namespace: media
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: media
  labels:
    app: image-resizer
    language: python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
        language: python
    spec:
      serviceAccountName: image-resizer-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: image-resizer
          image: myregistry/resizer:3.2
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: rabbitmq-config
                  key: host
            - name: RABBITMQ_QUEUE
              value: resize-queue
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
{
  "manifest_yaml": "# ⚠️ GÉNÉRATION LIBRE — non vérifiée par les contrôles habituels du pipeline, à valider manuellement avant tout déploiement.\napiVersion: keda.sh/v1alpha1\nkind: ScaledObject\nmetadata:\n  name: resize-queue-scaler\nspec:\n  scaleTargetRef:\n    name: <component_name>\n  minReplicaCount: 0\n  maxReplicaCount: 10\n  triggers:\n    - type: rabbitmq\n      metadata:\n        queueName: resize-queue\n        mode: QueueLength",
  "fields_addressed": [
    "non-standard requirements: KEDA scaling"
  ],
  "fields_left_open": [],
  "security_requirements_addressed": [],
  "security_requirements_left_open": [],
  "observability_requirements_addressed": [],
  "observability_requirements_left_open": [],
  "ingress_addressed": [],
  "ingress_left_open": [],
  "rbac_addressed": [],
  "rbac_left_open": [],
  "warnings": [
    "Ceci nécessite l'installation de l'opérateur KEDA dans le cluster.",
    "Le champ 'scaleTargetRef.name' utilise un placeholder <component_name> car aucun nom de composant n'a été fourni dans l'entrée."
  ]
}