apiVersion: v1
kind: Namespace
metadata:
  name: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page
  namespace: web
  labels:
    app: landing-page
    version: 1.27
    part-of: web-frontend
spec:
  replicas: 1 # Un seul réplica demandé : minimise la consommation CPU/RAM globale
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
        version: 1.27
        part-of: web-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # Utilisateur nginx par défaut
        fsGroup: 101
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true # Sécurité renforcée et réduction des I/O disque
          resources:
            # Dimensionnement minimaliste pour un site statique afin d'optimiser l'empreinte énergétique
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp # Nécessaire car readOnlyRootFilesystem est activé
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: landing-page-service
  namespace: web
spec:
  selector:
    app: landing-page
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-page-ingress
  namespace: web
  annotations:
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
    - host: www.exemple.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing-page-service
                port:
                  number: 80