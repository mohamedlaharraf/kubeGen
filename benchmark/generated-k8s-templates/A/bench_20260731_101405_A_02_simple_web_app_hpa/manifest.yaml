apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/instance: checkout-api-prod
    app.kubernetes.io/version: 1.4.2
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: payments
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: checkout-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/instance: checkout-api-prod
    app.kubernetes.io/version: 1.4.2
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: payments
spec:
  # # Les 3 réplicas initiaux seront gérés dynamiquement par l'HPA par la suite
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/instance: checkout-api-prod
        app.kubernetes.io/version: 1.4.2
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: payments
    spec:
      # # Bonnes pratiques de sécurité global Pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: checkout-api
          image: myregistry/checkout:1.4.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          # # Bonnes pratiques de sécurité Conteneur
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: checkout-db-secret
                  key: DB_PASSWORD
          # # Sonde de santé pour garantir la disponibilité
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          # # Optimisation énergétique : Requests ajustés au plus juste pour limiter
          # # la sur-allocation CPU/RAM sur les nœuds tout en autorisant des bursts temporaires.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # # Volume temporaire en mémoire pour autoriser le système de fichiers en lecture seule
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout-api-hpa
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: payments
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout-api
  # # Efficacité énergétique : descente à 2 réplicas lors des heures creuses (la nuit)
  # # et montée jusqu'à 8 réplicas lors des pics de charge de la journée.
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max