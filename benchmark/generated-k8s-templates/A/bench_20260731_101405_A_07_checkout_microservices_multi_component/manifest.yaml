apiVersion: v1
kind: Namespace
metadata:
  name: payments
  labels:
    app.kubernetes.io/part-of: payment-system
---
# ServiceAccount dédié pour checkout-api pour restreindre les privilèges RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: checkout-api-sa
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: payment-system
---
# Role RBAC autorisant uniquement la lecture/liste des ConfigMaps
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configmap-reader
  namespace: payments
  labels:
    app.kubernetes.io/part-of: payment-system
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: checkout-api-read-configmaps
  namespace: payments
  labels:
    app.kubernetes.io/part-of: payment-system
subjects:
- kind: ServiceAccount
  name: checkout-api-sa
  namespace: payments
roleRef:
  kind: Role
  name: configmap-reader
  apiGroup: rbac.authorization.k8s.io
---
# ConfigMap pour le worker (créé par défaut pour éviter un CrashLoopBackOff)
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: payments
  labels:
    app.kubernetes.io/name: order-worker
    app.kubernetes.io/part-of: payment-system
data:
  QUEUE_URL: "redis://queue.payments.svc.cluster.local:6379/0" # Valeur par défaut
---
# Secret pour le mot de passe DB (gabarit créé pour conformité)
apiVersion: v1
kind: Secret
metadata:
  name: checkout-db-secret
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: payment-system
type: Opaque
stringData:
  password: "CHANGE_ME_IN_PRODUCTION"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  namespace: payments
  labels:
    app.kubernetes.io/name: order-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: payment-system
    app.kubernetes.io/version: "1.5"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: payment-system
        app.kubernetes.io/version: "1.5"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: worker
        image: myregistry/worker:1.5
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        env:
        - name: QUEUE_URL
          valueFrom:
            configMapKeyRef:
              name: worker-config
              key: QUEUE_URL
        # Efficacité énergétique : Requests CPU/mémoire calibrés au plus bas pour un worker asynchrone
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: payment-system
    app.kubernetes.io/version: "2.0"
spec:
  replicas: 3 # Géré dynamiquement par l'HPA par la suite
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
      labels:
        app.kubernetes.io/name: checkout-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: payment-system
        app.kubernetes.io/version: "2.0"
    spec:
      serviceAccountName: checkout-api-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
      # Sécurité & Robustesse : Attendre que order-worker soit accessible avant de démarrer
      - name: wait-for-order-worker
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z order-worker 8080 || true; do echo waiting for order-worker; sleep 2; break; done']
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
      containers:
      - name: checkout-api
        image: myregistry/checkout:2.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9091
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: checkout-db-secret
              key: password
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        # Efficacité énergétique : Requests CPU modérés (100m) évitant l'allocation inutile de cœurs durant les heures creuses
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      # Sidecar Envoy Proxy pour le Service Mesh
      - name: envoy-sidecar
        image: envoyproxy/envoy:v1.28.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        ports:
        - name: envoy-admin
          containerPort: 9901
        # Efficacité énergétique : Empreinte minime attribuée au sidecar pour optimiser la densité des pods
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: envoy-tmp
          mountPath: /tmp
      volumes:
      - name: envoy-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: payment-system
spec:
  type: ClusterIP # Sécurité : Exposition uniquement en interne au cluster
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 9091
    targetPort: 9091
  selector:
    app.kubernetes.io/name: checkout-api
---
apiVersion: v1
kind: Service
metadata:
  name: order-worker
  namespace: payments
  labels:
    app.kubernetes.io/name: order-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: payment-system
spec:
  type: ClusterIP
  ports:
  - name: internal
    port: 8080
    targetPort: 8080
  selector:
    app.kubernetes.io/name: order-worker
---
# Autoscale pour répondre aux variations de trafic (nuit vs 9h-12h) et économiser l'énergie en heures creuses
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout-api-hpa
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: payment-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout-api
  minReplicas: 2 # Respecte la valeur min demandée pour la nuit
  maxReplicas: 8 # Capacité maximale pour le pic de charge (9h-12h)
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# Exposition externe sécurisée (HTTPS/TLS) limitée au port 8080 du service checkout-api
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkout-api-ingress
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: payment-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - checkout.exemple.com
    secretName: checkout-tls-cert
  rules:
  - host: checkout.exemple.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: checkout-api
            port:
              number: 8080
---
# Isolation Réseau STRICTE : Restriction du trafic intra-namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: payments
  labels:
    app.kubernetes.io/part-of: payment-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
# Autoriser le contrôleur Ingress vers checkout-api uniquement sur port 8080
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-checkout-api-ingress
  namespace: payments
  labels:
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/part-of: payment-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: checkout-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: order-worker
    ports:
    - protocol: TCP
      port: 8080
  # Métriques Prometheus
  - ports:
    - protocol: TCP
      port: 9091
  # Autoriser l'accès à l'API server K8s (ConfigMaps) et DNS
  - ports:
    - protocol: TCP
      port: 443
    - protocol: UDP
      port: 53
---
# Autoriser le trafic venant uniquement de checkout-api vers order-worker
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-order-worker-from-checkout
  namespace: payments
  labels:
    app.kubernetes.io/name: order-worker
    app.kubernetes.io/part-of: payment-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-worker
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: checkout-api
  egress:
  - ports:
    - protocol: UDP
      port: 53