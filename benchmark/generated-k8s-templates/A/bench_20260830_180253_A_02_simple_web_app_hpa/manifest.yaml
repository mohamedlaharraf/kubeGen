apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: payments
  labels:
    app: checkout-api
    version: 1.4.2
    part-of: payments-system
spec:
  replicas: 3 # Valeur initiale, sera gérée par l'HPA
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        version: 1.4.2
        part-of: payments-system
    spec:
      securityContext:
        # Sécurité : exécution en tant qu'utilisateur non-root
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 2000
      containers:
        - name: checkout-api
          image: myregistry/checkout:1.4.2
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: checkout-db-secret
                  key: password # Hypothèse : la clé dans le secret est 'password'
          securityContext:
            # Sécurité : système de fichiers en lecture seule pour limiter les attaques
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            # Efficacité énergétique : requests ajustées au plus juste pour éviter le gaspillage
            requests:
              cpu: "100m"
              memory: "256Mi"
            # Limites strictes pour éviter qu'un pod ne consomme toutes les ressources du nœud
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz # Hypothèse : endpoint de santé standard
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready # Hypothèse : endpoint de disponibilité
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api-svc
  namespace: payments
  labels:
    app: checkout-api
spec:
  selector:
    app: checkout-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout-api-hpa
  namespace: payments
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: checkout-api
  # Efficacité énergétique : minReplicas=2 pour haute disponibilité minimale, max=8 pour pics
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # Scale up dès 70% pour maintenir la performance sans sur-provisionner