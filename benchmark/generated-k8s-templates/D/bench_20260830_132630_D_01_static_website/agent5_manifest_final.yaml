apiVersion: v1
kind: ServiceAccount
metadata:
  name: landing-page-sa
  namespace: web
  labels:
    app.kubernetes.io/name: landing-page
    app.kubernetes.io/instance: landing-page
    app.kubernetes.io/version: '1.27'
    app.kubernetes.io/part-of: web
    app.kubernetes.io/managed-by: architecture-d
---
apiVersion: v1
kind: Service
metadata:
  name: landing-page
  namespace: web
  labels:
    app.kubernetes.io/name: landing-page
    app.kubernetes.io/instance: landing-page
    app.kubernetes.io/version: '1.27'
    app.kubernetes.io/part-of: web
    app.kubernetes.io/managed-by: architecture-d
spec:
  type: ClusterIP
  selector:
    app: landing-page
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: landing-page
  namespace: web
  labels:
    app.kubernetes.io/name: landing-page
    app.kubernetes.io/instance: landing-page
    app.kubernetes.io/version: '1.27'
    app.kubernetes.io/part-of: web
    app.kubernetes.io/managed-by: architecture-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: landing-page
  template:
    metadata:
      labels:
        app: landing-page
        app.kubernetes.io/name: landing-page
        app.kubernetes.io/instance: landing-page
        app.kubernetes.io/version: '1.27'
        app.kubernetes.io/part-of: web
        app.kubernetes.io/managed-by: architecture-d
    spec:
      serviceAccountName: landing-page-sa
      nodeSelector:
        nodepool: shared
      containers:
      - name: landing-page
        image: nginx:1.27
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "40m"
            memory: "64Mi"
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            add:
            - NET_BIND_SERVICE
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-page
  namespace: web
  labels:
    app.kubernetes.io/name: landing-page
    app.kubernetes.io/instance: landing-page
    app.kubernetes.io/version: '1.27'
    app.kubernetes.io/part-of: web
    app.kubernetes.io/managed-by: architecture-d
spec:
  rules:
  - host: www.exemple.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: landing-page
            port:
              number: 80
---
apiVersion: v1
kind: Namespace
metadata:
  name: web