apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-api-sa
  namespace: data
  labels:
    app.kubernetes.io/name: analytics-api
    app.kubernetes.io/instance: analytics-api
    app.kubernetes.io/version: "2.0"
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: architecture-d
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-api
  namespace: data
  labels:
    app: analytics-api
    app.kubernetes.io/name: analytics-api
    app.kubernetes.io/instance: analytics-api
    app.kubernetes.io/version: "2.0"
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: architecture-d
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-api
  template:
    metadata:
      labels:
        app: analytics-api
        app.kubernetes.io/name: analytics-api
        app.kubernetes.io/instance: analytics-api
        app.kubernetes.io/version: "2.0"
        app.kubernetes.io/part-of: data
        app.kubernetes.io/managed-by: architecture-d
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: analytics-api
    spec:
      serviceAccountName: analytics-api-sa
      containers:
        - name: analytics-api
          image: myregistry/analytics:2.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-api
  namespace: data
  labels:
    app: analytics-api
    app.kubernetes.io/name: analytics-api
    app.kubernetes.io/instance: analytics-api
    app.kubernetes.io/version: "2.0"
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: architecture-d
spec:
  type: ClusterIP
  selector:
    app: analytics-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-api-netpol
  namespace: data
  labels:
    app.kubernetes.io/name: analytics-api
    app.kubernetes.io/instance: analytics-api
    app.kubernetes.io/version: "2.0"
    app.kubernetes.io/part-of: data
    app.kubernetes.io/managed-by: architecture-d
spec:
  podSelector:
    matchLabels:
      app: analytics-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres-cluster
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
