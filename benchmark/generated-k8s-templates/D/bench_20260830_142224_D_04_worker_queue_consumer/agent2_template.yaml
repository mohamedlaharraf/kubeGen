apiVersion: v1
kind: Namespace
metadata:
  name: media

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-resizer-sa
  namespace: media
  labels:
    app: image-resizer
    app.kubernetes.io/name: image-resizer
    app.kubernetes.io/instance: image-resizer
    app.kubernetes.io/version: "3.2"
    app.kubernetes.io/part-of: media
    app.kubernetes.io/managed-by: architecture-d
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: media
  labels:
    app: image-resizer
    app.kubernetes.io/name: image-resizer
    app.kubernetes.io/instance: image-resizer
    app.kubernetes.io/version: "3.2"
    app.kubernetes.io/part-of: media
    app.kubernetes.io/managed-by: architecture-d
spec:
  replicas: 0
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
        app.kubernetes.io/name: image-resizer
        app.kubernetes.io/instance: image-resizer
        app.kubernetes.io/version: "3.2"
        app.kubernetes.io/part-of: media
        app.kubernetes.io/managed-by: architecture-d
    spec:
      serviceAccountName: image-resizer-sa
      containers:
        - name: image-resizer
          image: myregistry/resizer:3.2
          env:
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: rabbitmq-config
                  key: host
            - name: RABBITMQ_QUEUE
              value: "resize-queue"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault