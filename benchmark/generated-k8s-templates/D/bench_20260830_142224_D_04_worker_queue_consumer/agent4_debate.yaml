apiVersion: v1
kind: ServiceAccount
metadata:
  name: image-resizer-sa
  namespace: media
  labels:
    app: image-resizer
    app.kubernetes.io/name: image-resizer
    app.kubernetes.io/instance: image-resizer
    app.kubernetes.io/version: '3.2'
    app.kubernetes.io/part-of: media
    app.kubernetes.io/managed-by: architecture-d
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-resizer
  namespace: media
  labels:
    app: image-resizer
    app.kubernetes.io/name: image-resizer
    app.kubernetes.io/instance: image-resizer
    app.kubernetes.io/version: '3.2'
    app.kubernetes.io/part-of: media
    app.kubernetes.io/managed-by: architecture-d
spec:
  replicas: 0
  selector:
    matchLabels:
      app: image-resizer
  template:
    metadata:
      labels:
        app: image-resizer
        app.kubernetes.io/name: image-resizer
        app.kubernetes.io/instance: image-resizer
        app.kubernetes.io/version: '3.2'
        app.kubernetes.io/part-of: media
        app.kubernetes.io/managed-by: architecture-d
    spec:
      serviceAccountName: image-resizer-sa
      nodeSelector:
        nodepool: shared
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/part-of
                  operator: In
                  values:
                  - media
              topologyKey: "kubernetes.io/hostname"
      containers:
      - name: image-resizer
        image: myregistry/resizer:3.2
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "400m"
            memory: "512Mi"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: rabbitmq-config
              key: host
        - name: RABBITMQ_QUEUE
          value: resize-queue
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: image-resizer-scaledobject
  namespace: media
spec:
  scaleTargetRef:
    name: image-resizer
  minReplicaCount: 0
  maxReplicaCount: 10
  triggers:
  - type: rabbitmq
    metadata:
      queueName: resize-queue
      mode: QueueLength
      value: "5"
---
apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: media
data:
  host: rabbitmq-service.media.svc.cluster.local
