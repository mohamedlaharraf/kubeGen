apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-api-sa
  namespace: search
  labels:
    app: search-api
    app.kubernetes.io/name: search-api
    app.kubernetes.io/instance: search-api
    app.kubernetes.io/version: '1.0'
    app.kubernetes.io/part-of: search
    app.kubernetes.io/managed-by: architecture-d
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
    app.kubernetes.io/name: search-api
    app.kubernetes.io/instance: search-api
    app.kubernetes.io/version: '1.0'
    app.kubernetes.io/part-of: search
    app.kubernetes.io/managed-by: architecture-d
spec:
  type: ClusterIP
  selector:
    app: search-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-api-netpol
  namespace: search
  labels:
    app: search-api
    app.kubernetes.io/name: search-api
    app.kubernetes.io/instance: search-api
    app.kubernetes.io/version: '1.0'
    app.kubernetes.io/part-of: search
    app.kubernetes.io/managed-by: architecture-d
spec:
  podSelector:
    matchLabels:
      app: search-api
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
    app.kubernetes.io/name: search-api
    app.kubernetes.io/instance: search-api
    app.kubernetes.io/version: '1.0'
    app.kubernetes.io/part-of: search
    app.kubernetes.io/managed-by: architecture-d
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
        app.kubernetes.io/name: search-api
        app.kubernetes.io/instance: search-api
        app.kubernetes.io/version: '1.0'
        app.kubernetes.io/part-of: search
        app.kubernetes.io/managed-by: architecture-d
    spec:
      serviceAccountName: search-api-sa
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nodepool
                operator: In
                values:
                - shared
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 50
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: search-api
              topologyKey: "kubernetes.io/hostname"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: search-api
        image: myregistry/search:1.0
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "200m"
            memory: "384Mi"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      - name: vault-agent
        image: hashicorp/vault-agent
        resources:
          requests:
            cpu: "20m"
            memory: "32Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
---
apiVersion: v1
kind: Namespace
metadata:
  name: search
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch-sa
  namespace: search
  labels:
    app: elasticsearch
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: elasticsearch
    app.kubernetes.io/version: "unknown"
    app.kubernetes.io/part-of: "default"
    app.kubernetes.io/managed-by: "architecture-d"
---
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: search
  labels:
    app: elasticsearch
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: elasticsearch
    app.kubernetes.io/version: "unknown"
    app.kubernetes.io/part-of: "default"
    app.kubernetes.io/managed-by: "architecture-d"
spec:
  version: 8.12.0
  nodeSets:
    - name: default
      count: 3
      podTemplate:
        metadata:
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/role: "elasticsearch"
        spec:
          serviceAccountName: elasticsearch-sa
          containers:
            - name: elasticsearch
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault