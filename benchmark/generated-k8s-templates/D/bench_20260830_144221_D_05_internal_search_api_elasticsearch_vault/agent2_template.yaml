apiVersion: v1
kind: Namespace
metadata:
  name: search

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: search-api-sa
  namespace: search
  labels:
    app: search-api
    app.kubernetes.io/name: search-api
    app.kubernetes.io/instance: search-api
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/part-of: search
    app.kubernetes.io/managed-by: architecture-d
---
apiVersion: v1
kind: Service
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
    app.kubernetes.io/name: search-api
    app.kubernetes.io/instance: search-api
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/part-of: search
    app.kubernetes.io/managed-by: architecture-d
spec:
  type: ClusterIP
  selector:
    app: search-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: search-api-netpol
  namespace: search
  labels:
    app: search-api
    app.kubernetes.io/name: search-api
    app.kubernetes.io/instance: search-api
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/part-of: search
    app.kubernetes.io/managed-by: architecture-d
spec:
  podSelector:
    matchLabels:
      app: search-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  namespace: search
  labels:
    app: search-api
    app.kubernetes.io/name: search-api
    app.kubernetes.io/instance: search-api
    app.kubernetes.io/version: "1.0"
    app.kubernetes.io/part-of: search
    app.kubernetes.io/managed-by: architecture-d
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
        app.kubernetes.io/name: search-api
        app.kubernetes.io/instance: search-api
        app.kubernetes.io/version: "1.0"
        app.kubernetes.io/part-of: search
        app.kubernetes.io/managed-by: architecture-d
    spec:
      serviceAccountName: search-api-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search-api
          image: myregistry/search:1.0
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: vault-agent
          image: hashicorp/vault-agent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
